<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- The assistant's avatar: a pebble in the wave's colours with a calm,
       smiling face and a small sparkle that marks it as AI. -->
  <defs>
    <linearGradient id="pebble" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#a0a9fc"/>
      <stop offset="0.45" stop-color="#c098f5"/>
      <stop offset="0.8" stop-color="#faa4cd"/>
      <stop offset="1" stop-color="#ffc9a3"/>
    </linearGradient>
  </defs>
  <path d="M32 6c15 0 27 9 27 25 0 15-12 27-27 27S5 47 5 32C5 16 17 6 32 6z" fill="url(#pebble)"/>
  <!-- Closed, smiling eyes and a smile. -->
  <g fill="none" stroke="#191e49" stroke-width="3" stroke-linecap="round">
    <path d="M20 31q4-4 8 0"/>
    <path d="M36 31q4-4 8 0"/>
    <path d="M24 40q8 7 16 0"/>
  </g>
  <!-- The sparkle. -->
  <path d="M50 8l1.8 4.2L56 14l-4.2 1.8L50 20l-1.8-4.2L44 14l4.2-1.8z" fill="#ffffff"/>
